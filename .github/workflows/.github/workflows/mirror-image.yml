name: Mirror collector image

on:
  workflow_dispatch:
    inputs:
      source_image:
        description: "Source image to copy"
        required: true
        default: "hystax/kube-service-selectors:0.1.0"
      target_tag:
        description: "Tag to publish under"
        required: true
        default: "0.1.0"

jobs:
  mirror:
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up buildx
        uses: docker/setup-buildx-action@v3

      - name: Copy image
        run: |
          TARGET="ghcr.io/${{ github.repository_owner }}/kube-service-selectors:${{ inputs.target_tag }}"
          echo "Copying ${{ inputs.source_image }} to ${TARGET}"
          docker buildx imagetools create --tag "${TARGET}" "${{ inputs.source_image }}"

      - name: Show the result
        run: |
          TARGET="ghcr.io/${{ github.repository_owner }}/kube-service-selectors:${{ inputs.target_tag }}"
          docker buildx imagetools inspect "${TARGET}"
